# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.
# See https://tox.readthedocs.io/en/latest/config.html for reference.
#
# Environments and dependencies are created/installed via uv
# (https://github.com/tox-dev/tox-uv) instead of virtualenv/pip.

[tox]
requires =
    tox-uv >= 1.11

# Environments run by default and in this order
#  unless specified via CLI -eENVLIST
#  or environment variable TOXENV
envlist =
    clean
    # tests
    base
    sample
    jax
    roadrunner
    petab
    optimize
    hierarchical
    select
    # quality
    project
    flake8
    doc
    size
    check_tests
    # notebooks
    notebooks1
    notebooks2

# Base-environment

[testenv]
passenv = AMICI_PARALLEL_COMPILE,BNGPATH,CC,COLUMNS,CXX,GITHUB_ACTIONS,MPLBACKEND
# some environments (e.g. petab) install/uninstall packages via `pip` directly
#  in commands_pre/commands, so seed pip into the uv-created venvs
uv_seed = true
commands_pre =
    python -m pip list

# Sub-environments
#  inherit settings defined in the base

[testenv:clean]
skip_install = true
allowlist_externals =
    rm
deps = coverage
commands =
    coverage erase
    rm -rf .coverage*
    rm -rf coverage.xml
description =
    Clean up before tests

# Unit tests

[testenv:base]
extras = test,amici,petab,mltools,fides
deps =
    git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master\#subdirectory=src/python
commands =
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/base --durations=0 \
        test/profile --durations=0 \
        test/visualize --durations=0
description =
    Test basic functionality

[testenv:sample]
extras = test,amici,petab,pymc,dynesty,emcee
commands =
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/sample --durations=0 \
        test/variational --durations=0
description =
    Test sampling and variational inference

[testenv:jax]
extras = test,jax
commands =
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/jax --durations=0
description =
    Test jax-based objective functionality

[testenv:roadrunner]
extras = test,petab,roadrunner
deps =
    git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master\#subdirectory=src/python
    git+https://github.com/PEtab-dev/petab_test_suite@main
commands =
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/roadrunner --durations=0
description =
    Test roadrunner simulator support

[testenv:mac]
# full test/base + test/profile + test/sample + test/variational +
# test/visualize + test/jax + test/roadrunner in one env, run on macOS
# as a single broad OS-compatibility check instead of splitting it the
# same way as the faster, more focused Linux jobs above.
extras = test,amici,petab,mltools,fides,pymc,dynesty,emcee,jax,roadrunner
deps =
    git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master\#subdirectory=src/python
    git+https://github.com/PEtab-dev/petab_test_suite@main
commands =
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/base --durations=0 \
        test/profile --durations=0 \
        test/sample --durations=0 \
        test/variational --durations=0 \
        test/visualize --durations=0 \
        test/jax --durations=0 \
        test/roadrunner --durations=0
description =
    Full test suite, for macOS compatibility checks

[testenv:windows]
extras = test
commands =
    pytest \
        test/base/test_prior.py \
        test/base/test_problem.py \
        test/base/test_workflow.py
description =
    Test basic functionality on Windows

[testenv:petab]
extras = test,petab,pyswarm,roadrunner
deps =
    git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master\#subdirectory=src/python
# always install amici from main branch, avoid caching
#  to skip re-installation, run `tox -e petab --override testenv:petab.commands_pre=`
commands_pre =
   python3 -m pip uninstall -y amici petabtests
   python3 -m pip install git+https://github.com/AMICI-dev/amici.git@main\#egg=amici&subdirectory=python/sdist
   python3 -m pip install git+https://github.com/PEtab-dev/petab_test_suite@main
   python -m pip list
commands =
    python3 -m pip install git+https://github.com/pysb/pysb@master
    python3 -m pip install -U copasi-basico[petab]
    python3 -m pip uninstall -y petab
    python3 -m pip install git+https://github.com/petab-dev/libpetab-python@main\#egg=petab
    # upgrade after installing pysb which requires an older sympy
    python3 -m pip install -U sympy
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/petab
description =
    Test PEtab functionality

[testenv:julia]
extras = test,julia
commands =
    python -c "import julia; julia.install()"
    python-jl -m pytest --cov=pypesto --cov-report=xml --cov-append \
        test/julia
description =
    Test Julia interface

[testenv:optimize]
extras = test,dlib,ipopt,pyswarm,cma,nlopt,fides,mpi,pyswarms,petab
commands =
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/optimize
description =
    Test optimization module

[testenv:hierarchical]
extras = test,petab,amici,fides
deps =
    git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master\#subdirectory=src/python
commands =
    # workaround as ipopt has incomplete build
    pytest --cov=pypesto --cov-report=xml --cov-append \
        test/hierarchical
description =
    Test hierarchical optimization module

[testenv:select]
extras = test,amici,petab,select,fides
commands =
    pytest -svvv --cov=pypesto --cov-report=xml --cov-append \
        test/select
description =
    Test model selection functionality

[testenv:notebooks1]
allowlist_externals = bash
extras = example,amici,petab,pyswarms,pymc,cma,nlopt,fides,roadrunner
commands =
    bash test/run_notebook.sh 1
description =
    Run notebooks 1

[testenv:notebooks2]
allowlist_externals = bash
extras = example,amici,petab,pymc,emcee,dynesty,select
commands =
    bash test/run_notebook.sh 2
description =
    Run notebooks 2

# Management, docs

[testenv:doc]
extras =
    doc,amici,petab,jax,select,roadrunner
commands =
    sphinx-build -W -b html doc/ doc/_build/html
description =
    Test whether docs build passes

[testenv:size]
skip_install = true
allowlist_externals = bash
commands =
    bash test/check_git_size.sh
description =
    Check repository size

[testenv:check_tests]
skip_install = true
allowlist_externals = bash
commands =
    bash test/check_test_dirs_referenced.sh
description =
    Check that every test/ subdirectory is wired into some tox environment
